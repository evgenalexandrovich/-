name: Utility App Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Android Project
      run: |
        mkdir -p app/src/main/java/com/my/utility
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. settings.gradle
        echo "include ':app'" > settings.gradle

        # 2. build.gradle (Root)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.my.utility'
            compileSdk 34
            defaultConfig {
                applicationId "com.my.utility"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.10.0'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Учет ЖКХ" android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                <activity android:name="com.my.utility.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/my/utility/MainActivity.java
        package com.my.utility;

        import android.content.Context;
        import android.content.SharedPreferences;
        import android.graphics.Color;
        import android.graphics.Typeface;
        import android.graphics.drawable.GradientDrawable;
        import android.os.Bundle;
        import android.text.Editable;
        import android.text.InputType;
        import android.text.TextWatcher;
        import android.util.TypedValue;
        import android.view.Gravity;
        import android.view.View;
        import android.widget.*;
        import androidx.appcompat.app.AlertDialog;
        import androidx.appcompat.app.AppCompatActivity;
        import com.google.android.material.card.MaterialCardView;

        public class MainActivity extends AppCompatActivity {
            private SharedPreferences p;
            private EditText eP, eC, w1, w2, w3, w4, wP, sK, sT, sV, sWT, sG;
            private TextView tTot, tE, tW, tG;
            private View vCalc, vSet;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                p = getSharedPreferences("data", MODE_PRIVATE);

                LinearLayout root = new LinearLayout(this);
                root.setOrientation(LinearLayout.VERTICAL);
                root.setBackgroundColor(Color.parseColor("#F2F2F7"));

                FrameLayout content = new FrameLayout(this);
                content.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));

                vCalc = createCalc();
                vSet = createSet();
                content.addView(vCalc);
                content.addView(vSet);
                vSet.visibility = View.GONE;

                LinearLayout nav = new LinearLayout(this);
                nav.setOrientation(LinearLayout.HORIZONTAL);
                nav.setBackgroundColor(Color.WHITE);
                nav.setElevation(20);
                
                nav.addView(makeTab("📊 Расчет", true));
                nav.addView(makeTab("⚙️ Настройки", false));

                root.addView(content);
                root.addView(nav);
                setContentView(root);
                load();
            }

            private View makeTab(String title, boolean active) {
                Button b = new Button(this);
                b.setText(title);
                b.setBackgroundColor(0);
                b.setTextColor(active ? Color.parseColor("#007AFF") : Color.GRAY);
                b.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));
                b.setOnClickListener(v -> {
                    boolean isC = title.contains("Расчет");
                    vCalc.visibility = isC ? View.VISIBLE : View.GONE;
                    vSet.visibility = isC ? View.GONE : View.VISIBLE;
                    b.setTextColor(Color.parseColor("#007AFF"));
                    Toast.makeText(this, "Переключено", Toast.LENGTH_SHORT).show();
                });
                return b;
            }

            private View createCalc() {
                ScrollView sv = new ScrollView(this);
                LinearLayout l = new LinearLayout(this);
                l.setOrientation(LinearLayout.VERTICAL);
                l.setPadding(30, 30, 30, 30);

                MaterialCardView head = new MaterialCardView(this);
                head.setCardBackgroundColor(Color.parseColor("#007AFF"));
                head.setRadius(50);
                LinearLayout hl = new LinearLayout(this);
                hl.setOrientation(LinearLayout.VERTICAL);
                hl.setPadding(40, 60, 40, 60);
                hl.setGravity(Gravity.CENTER);

                tTot = new TextView(this);
                tTot.setTextSize(38);
                tTot.setTextColor(-1);
                tTot.setTypeface(null, Typeface.BOLD);
                
                Button btnOk = new Button(this);
                btnOk.setText("Закрыть месяц");
                btnOk.setOnClickListener(v -> {
                    eP.setText(eC.getText()); eC.setText("");
                    float ws = get(w1)+get(w2)+get(w3)+get(w4);
                    wP.setText(String.valueOf(ws));
                    w1.setText(""); w2.setText(""); w3.setText(""); w4.setText("");
                    calc();
                });

                hl.addView(tTot); hl.addView(btnOk);
                head.addView(hl);
                l.addView(head);

                eP = in(l, "Эл-во: Пред."); eC = in(l, "Эл-во: Тек.");
                tE = txt(l);
                w1 = in(l, "Вода №1"); w2 = in(l, "Вода №2");
                w3 = in(l, "Вода №3"); w4 = in(l, "Вода №4");
                wP = in(l, "Вода: Пред. сумма");
                tW = txt(l);
                tG = txt(l);

                sv.addView(l);
                return sv;
            }

            private View createSet() {
                LinearLayout l = new LinearLayout(this);
                l.setOrientation(LinearLayout.VERTICAL);
                l.setPadding(40, 40, 40, 40);
                sK = in(l, "Коэфф. эл-ва (40)"); sT = in(l, "Тариф эл-ва (10.48)");
                sV = in(l, "НДС % (20)"); sWT = in(l, "Тариф вода (71.55)");
                sG = in(l, "Газ фикс. (10000)");
                sK.setText("40"); sT.setText("10.48"); sV.setText("20"); sWT.setText("71.55"); sG.setText("10000");
                return l;
            }

            private EditText in(LinearLayout l, String h) {
                EditText e = new EditText(this);
                e.setHint(h);
                e.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                e.addTextChangedListener(new TextWatcher() {
                    public void afterTextChanged(Editable s) { calc(); }
                    public void beforeTextChanged(CharSequence s, int a, int b, int c) {}
                    public void onTextChanged(CharSequence s, int a, int b, int c) {}
                });
                l.addView(e); return e;
            }

            private TextView txt(LinearLayout l) {
                TextView t = new TextView(this);
                t.setPadding(0, 5, 0, 25);
                t.setTypeface(null, Typeface.ITALIC);
                l.addView(t); return t;
            }

            private float get(EditText e) { 
                try { return Float.parseFloat(e.getText().toString()); } catch(Exception ex) { return 0; }
            }

            private void calc() {
                float ek=get(sK), et=get(sT), ev=get(sV), wt=get(sWT), gf=get(sG);
                float ed = Math.max(0, get(eC)-get(eP)) * ek;
                float es = ed * et * (1 + ev/100);
                tE.setText("Свет: " + String.format("%.2f", es) + " р.");
                
                float wd = Math.max(0, (get(w1)+get(w2)+get(w3)+get(w4)) - get(wP));
                float ws = wd * wt;
                tW.setText("Вода: " + String.format("%.2f", ws) + " р.");
                tG.setText("Газ: " + gf + " р.");
                tTot.setText(Math.round(es + ws + gf) + " ₽");
            }

            private void load() { calc(); }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.4

    - name: Build APK
      run: gradle assembleDebug --no-daemon

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: UtilityApp
        path: app/build/outputs/apk/debug/*.apk
