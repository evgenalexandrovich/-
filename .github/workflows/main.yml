name: Build Zero-Dependency Pro App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Pure Android Project
      run: |
        mkdir -p app/src/main/java/com/calc/pro
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26

        # --- НАСТРОЙКИ СБОРКИ ---
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # АБСОЛЮТНО ЧИСТЫЕ ЗАВИСИМОСТИ (НОЛЬ ВНЕШНИХ БИБЛИОТЕК!)
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.calc.pro'
            compileSdk 34
            defaultConfig {
                applicationId "com.calc.pro"
                minSdk 24
                targetSdk 34
                versionCode 3
                versionName "3.0 Pro"
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
        }
        dependencies {}
        EOF

        # --- МАНИФЕСТ ---
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application 
                android:label="ЖКХ Pro" 
                android:icon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar" 
                android:allowBackup="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # --- ИКОНКИ ---
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0A84FF" android:pathData="M0,0h108v108h-108z"/></vector>
        EOF
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M12,3 L2,12 h3 v8 h14 v-8 h3 L12,3 z M13,18 v-4 h3 l-5,-7 v5 h-2 L13,18 z"/></vector>
        EOF
        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg" /><foreground android:drawable="@drawable/ic_launcher_fg" /></adaptive-icon>
        EOF

        # --- JAVA КОД ПРИЛОЖЕНИЯ (PURE ANDROID SDK) ---
        cat << 'EOF' > app/src/main/java/com/calc/pro/MainActivity.java
        package com.calc.pro;

        import android.app.Activity;
        import android.app.AlertDialog;
        import android.content.Context;
        import android.content.SharedPreferences;
        import android.graphics.*;
        import android.graphics.drawable.GradientDrawable;
        import android.os.Bundle;
        import android.text.*;
        import android.util.TypedValue;
        import android.view.*;
        import android.widget.*;
        import org.json.*;
        import java.text.SimpleDateFormat;
        import java.util.*;

        public class MainActivity extends Activity {
            private SharedPreferences prefs;
            private JSONObject db;
            private String currentObjId;
            private LinearLayout mainContainer, topBar;
            private TextView topTitle;
            private Button backBtn, themeBtn;
            private int currentScreen = 0; // 0=objects, 1=calc, 2=settings, 3=history
            
            private boolean isDark = false;
            private int colorBg, colorCard, colorText1, colorText2, colorAccent, colorDiv;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                prefs = getSharedPreferences("ProDB_v2", MODE_PRIVATE);
                isDark = prefs.getBoolean("isDark", false);

                applyThemeColors();
                loadDB();

                LinearLayout root = new LinearLayout(this);
                root.setOrientation(LinearLayout.VERTICAL);
                root.setBackgroundColor(colorBg);

                topBar = new LinearLayout(this);
                topBar.setOrientation(LinearLayout.HORIZONTAL);
                topBar.setBackgroundColor(colorCard);
                topBar.setPadding(dp(16), dp(16), dp(16), dp(16));
                topBar.setGravity(Gravity.CENTER_VERTICAL);

                backBtn = new Button(this);
                backBtn.setText("←"); backBtn.setTextColor(colorAccent);
                backBtn.setBackgroundColor(Color.TRANSPARENT);
                backBtn.setTextSize(24); backBtn.setOnClickListener(v -> showObjects());
                
                topTitle = new TextView(this);
                topTitle.setText("Мои объекты"); topTitle.setTextColor(colorText1);
                topTitle.setTextSize(20); topTitle.setTypeface(null, Typeface.BOLD);
                topTitle.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));
                
                themeBtn = new Button(this);
                themeBtn.setText(isDark ? "☀️" : "🌙"); themeBtn.setBackgroundColor(0);
                themeBtn.setOnClickListener(v -> toggleTheme());

                topBar.addView(backBtn); topBar.addView(topTitle); topBar.addView(themeBtn);
                
                mainContainer = new LinearLayout(this);
                mainContainer.setOrientation(LinearLayout.VERTICAL);
                mainContainer.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));

                root.addView(topBar); root.addView(mainContainer);
                setContentView(root);
                showObjects();
            }

            private void applyThemeColors() {
                if (isDark) {
                    colorBg = Color.parseColor("#121212");
                    colorCard = Color.parseColor("#1E1E1E");
                    colorText1 = Color.parseColor("#FFFFFF");
                    colorText2 = Color.parseColor("#AAAAAA");
                    colorAccent = Color.parseColor("#0A84FF");
                    colorDiv = Color.parseColor("#2C2C2E");
                } else {
                    colorBg = Color.parseColor("#F2F2F7");
                    colorCard = Color.parseColor("#FFFFFF");
                    colorText1 = Color.parseColor("#000000");
                    colorText2 = Color.parseColor("#8E8E93");
                    colorAccent = Color.parseColor("#007AFF");
                    colorDiv = Color.parseColor("#E5E5EA");
                }
            }

            private void toggleTheme() {
                isDark = !isDark;
                prefs.edit().putBoolean("isDark", isDark).apply();
                recreate();
            }

            private void loadDB() {
                try {
                    String s = prefs.getString("db", null);
                    db = (s == null) ? new JSONObject().put("objects", new JSONObject()) : new JSONObject(s);
                } catch (Exception e) { db = new JSONObject(); }
            }
            private void saveDB() { prefs.edit().putString("db", db.toString()).apply(); }
            private JSONObject getObj() { try { return db.getJSONObject("objects").getJSONObject(currentObjId); } catch(Exception e) {return null;} }

            // ===== ЭКРАН 1: ОБЪЕКТЫ =====
            private void showObjects() {
                currentScreen = 0;
                backBtn.setVisibility(View.GONE); themeBtn.setVisibility(View.VISIBLE);
                topTitle.setText("Мои объекты");
                mainContainer.removeAllViews();
                
                ScrollView sv = new ScrollView(this);
                LinearLayout l = new LinearLayout(this);
                l.setOrientation(LinearLayout.VERTICAL); l.setPadding(dp(16), dp(16), dp(16), dp(16));

                try {
                    JSONObject objs = db.getJSONObject("objects");
                    Iterator<String> keys = objs.keys();
                    while(keys.hasNext()) {
                        String id = keys.next();
                        l.addView(makeObjCard(id, objs.getJSONObject(id).getString("name")));
                    }
                } catch(Exception e) {}

                Button btnAdd = new Button(this);
                btnAdd.setText("+ Добавить объект"); btnAdd.setTextColor(Color.WHITE);
                GradientDrawable bg = new GradientDrawable(); bg.setColor(Color.parseColor("#34C759")); bg.setCornerRadius(dp(12));
                btnAdd.setBackground(bg); btnAdd.setOnClickListener(v -> addObjDialog());
                LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2); p.setMargins(0, dp(16), 0, 0);
                btnAdd.setLayoutParams(p); l.addView(btnAdd);

                sv.addView(l); mainContainer.addView(sv);
            }

            private View makeObjCard(String id, String name) {
                LinearLayout card = makeCard();
                card.setOrientation(LinearLayout.HORIZONTAL); card.setGravity(Gravity.CENTER_VERTICAL);
                TextView t = new TextView(this); t.setText("🏠 " + name); t.setTextColor(colorText1);
                t.setTextSize(18); t.setTypeface(null, Typeface.BOLD);
                t.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));
                Button go = new Button(this); go.setText("→"); go.setTextColor(colorAccent); go.setBackgroundColor(0); go.setTextSize(24);
                card.addView(t); card.addView(go);
                card.setOnClickListener(v -> { currentObjId = id; showCalc(); });
                card.setOnLongClickListener(v -> {
                    new AlertDialog.Builder(this).setTitle("Удалить объект?").setPositiveButton("Да", (d,w)->{
                        try { db.getJSONObject("objects").remove(id); saveDB(); showObjects(); } catch(Exception e){}
                    }).setNegativeButton("Нет", null).show();
                    return true;
                });
                return card;
            }

            private void addObjDialog() {
                EditText in = new EditText(this); in.setHint("Квартира 1");
                new AlertDialog.Builder(this).setTitle("Новый объект").setView(in).setPositiveButton("Создать", (d,w)->{
                    try {
                        String name = in.getText().toString(); if(name.isEmpty()) return;
                        JSONObject o = new JSONObject();
                        o.put("name", name);
                        o.put("en_el", true); o.put("el_k", 1.0); o.put("el_t", 5.0); o.put("el_v", 0.0);
                        o.put("en_cw", true); o.put("cw_c", 2); o.put("cw_t", 45.0);
                        o.put("en_hw", true); o.put("hw_c", 2); o.put("hw_t", 200.0);
                        o.put("en_sw", true); o.put("sw_t", 30.0);
                        o.put("en_gas", false); o.put("gas_m", false); o.put("gas_t", 500.0);
                        o.put("cur", new JSONObject()); o.put("hist", new JSONArray());
                        db.getJSONObject("objects").put("obj_"+System.currentTimeMillis(), o);
                        saveDB(); showObjects();
                    } catch(Exception e){}
                }).show();
            }

            // ===== ВНУТРЕННЯЯ НАВИГАЦИЯ ОБЪЕКТА =====
            private LinearLayout objNav;
            private void setupObjNav() {
                objNav = new LinearLayout(this); objNav.setOrientation(LinearLayout.HORIZONTAL);
                objNav.setPadding(0, 0, 0, dp(16));
                Button bC = navBtn("📊 Расчет"); Button bH = navBtn("📈 История"); Button bS = navBtn("⚙️ Настройки");
                bC.setOnClickListener(v -> showCalc()); bH.setOnClickListener(v -> showHist()); bS.setOnClickListener(v -> showSet());
                objNav.addView(bC); objNav.addView(bH); objNav.addView(bS);
            }
            private Button navBtn(String t) {
                Button b = new Button(this); b.setText(t); b.setTextSize(12); b.setBackgroundColor(0); b.setTextColor(colorAccent);
                b.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f)); return b;
            }

            // ===== ЭКРАН 2: КАЛЬКУЛЯТОР (ДИНАМИЧЕСКИЙ) =====
            EditText eElP, eElC, eGasP, eGasC, eCWP, eHWP;
            List<EditText> cwIns = new ArrayList<>(), hwIns = new ArrayList<>();
            TextView tTot, tEl, tCW, tHW, tSW, tGas;
            
            private void showCalc() {
                currentScreen = 1; JSONObject obj = getObj(); if(obj==null) return;
                backBtn.setVisibility(View.VISIBLE); themeBtn.setVisibility(View.GONE);
                try { topTitle.setText(obj.getString("name")); } catch(Exception e){}
                mainContainer.removeAllViews();
                
                ScrollView sv = new ScrollView(this);
                LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(dp(16), dp(16), dp(16), dp(16));
                setupObjNav(); l.addView(objNav);

                // TOTAL CARD
                LinearLayout tCard = makeCard(); tCard.setGravity(Gravity.CENTER);
                ((GradientDrawable)tCard.getBackground()).setColor(colorAccent);
                TextView tl = new TextView(this); tl.setText("ИТОГО"); tl.setTextColor(Color.WHITE);
                tTot = new TextView(this); tTot.setText("0 ₽"); tTot.setTextSize(36); tTot.setTypeface(null, Typeface.BOLD); tTot.setTextColor(Color.WHITE);
                Button bClose = new Button(this); bClose.setText("Закрыть месяц"); bClose.setTextColor(colorAccent);
                GradientDrawable bbg = new GradientDrawable(); bbg.setColor(Color.WHITE); bbg.setCornerRadius(dp(12)); bClose.setBackground(bbg);
                bClose.setOnClickListener(v -> saveMonth());
                tCard.addView(tl); tCard.addView(tTot); tCard.addView(bClose); l.addView(tCard);

                JSONObject cur = obj.optJSONObject("cur"); if(cur==null) cur = new JSONObject();
                cwIns.clear(); hwIns.clear();

                // ЭЛЕКТРОЭНЕРГИЯ
                if(obj.optBoolean("en_el")) {
                    LinearLayout c = makeCard(); c.addView(title("⚡ Электроэнергия"));
                    LinearLayout r = new LinearLayout(this);
                    eElP = inp("Пред.", 1f, cur.optString("elP")); eElC = inp("Тек.", 1f, cur.optString("elC"));
                    r.addView(eElP); r.addView(eElC); c.addView(r);
                    tEl = info(); c.addView(tEl); l.addView(c);
                }

                // ХОЛОДНАЯ ВОДА
                if(obj.optBoolean("en_cw")) {
                    LinearLayout c = makeCard(); c.addView(title("💧 ХВС"));
                    int cnt = obj.optInt("cw_c", 2);
                    JSONArray arr = cur.optJSONArray("cwA");
                    for(int i=0; i<cnt; i+=2) {
                        LinearLayout r = new LinearLayout(this);
                        EditText e1 = inp("Сч."+(i+1), 1f, (arr!=null && i<arr.length())?arr.optString(i):""); cwIns.add(e1); r.addView(e1);
                        if(i+1<cnt) { EditText e2 = inp("Сч."+(i+2), 1f, (arr!=null && i+1<arr.length())?arr.optString(i+1):""); cwIns.add(e2); r.addView(e2); }
                        c.addView(r);
                    }
                    eCWP = inp("Сумма прошлый мес.", 0f, cur.optString("cwP")); c.addView(eCWP);
                    tCW = info(); c.addView(tCW); l.addView(c);
                }

                // ГОРЯЧАЯ ВОДА
                if(obj.optBoolean("en_hw")) {
                    LinearLayout c = makeCard(); c.addView(title("🔥 ГВС"));
                    int cnt = obj.optInt("hw_c", 2);
                    JSONArray arr = cur.optJSONArray("hwA");
                    for(int i=0; i<cnt; i+=2) {
                        LinearLayout r = new LinearLayout(this);
                        EditText e1 = inp("Сч."+(i+1), 1f, (arr!=null && i<arr.length())?arr.optString(i):""); hwIns.add(e1); r.addView(e1);
                        if(i+1<cnt) { EditText e2 = inp("Сч."+(i+2), 1f, (arr!=null && i+1<arr.length())?arr.optString(i+1):""); hwIns.add(e2); r.addView(e2); }
                        c.addView(r);
                    }
                    eHWP = inp("Сумма прошлый мес.", 0f, cur.optString("hwP")); c.addView(eHWP);
                    tHW = info(); c.addView(tHW); l.addView(c);
                }

                // ВОДООТВЕДЕНИЕ
                if(obj.optBoolean("en_sw")) {
                    LinearLayout c = makeCard(); c.addView(title("🚰 Водоотведение"));
                    tSW = info(); c.addView(tSW); l.addView(c);
                }

                // ГАЗ
                if(obj.optBoolean("en_gas")) {
                    LinearLayout c = makeCard(); c.addView(title("💨 Газ"));
                    if(obj.optBoolean("gas_m")) {
                        LinearLayout r = new LinearLayout(this);
                        eGasP = inp("Пред.", 1f, cur.optString("gasP")); eGasC = inp("Тек.", 1f, cur.optString("gasC"));
                        r.addView(eGasP); r.addView(eGasC); c.addView(r);
                    }
                    tGas = info(); c.addView(tGas); l.addView(c);
                }

                sv.addView(l); mainContainer.addView(sv);
                doCalc();
            }

            private float f(EditText e) { try{return Float.parseFloat(e.getText().toString());}catch(Exception ex){return 0;} }

            private float sumEl=0, sumCW=0, sumHW=0, sumSW=0, sumGas=0, total=0;

            private void doCalc() {
                JSONObject o = getObj(); if(o==null) return;
                total = 0; float volC=0, volH=0;

                if(o.optBoolean("en_el") && eElP!=null && eElC!=null) {
                    float d = Math.max(0, f(eElC)-f(eElP)) * (float)o.optDouble("el_k");
                    sumEl = d * (float)o.optDouble("el_t") * (1 + (float)o.optDouble("el_v")/100);
                    tEl.setText(String.format("Расход: %.0f | Итого: %.2f ₽", d, sumEl)); total += sumEl;
                }
                if(o.optBoolean("en_cw") && eCWP!=null) {
                    float s = 0; for(EditText e : cwIns) s+=f(e);
                    volC = Math.max(0, s - f(eCWP)); sumCW = volC * (float)o.optDouble("cw_t");
                    tCW.setText(String.format("Расход: %.2f | Итого: %.2f ₽", volC, sumCW)); total += sumCW;
                }
                if(o.optBoolean("en_hw") && eHWP!=null) {
                    float s = 0; for(EditText e : hwIns) s+=f(e);
                    volH = Math.max(0, s - f(eHWP)); sumHW = volH * (float)o.optDouble("hw_t");
                    tHW.setText(String.format("Расход: %.2f | Итого: %.2f ₽", volH, sumHW)); total += sumHW;
                }
                if(o.optBoolean("en_sw") && tSW!=null) {
                    sumSW = (volC + volH) * (float)o.optDouble("sw_t");
                    tSW.setText(String.format("Объем: %.2f | Итого: %.2f ₽", (volC+volH), sumSW)); total += sumSW;
                }
                if(o.optBoolean("en_gas") && tGas!=null) {
                    if(o.optBoolean("gas_m") && eGasP!=null && eGasC!=null) {
                        float d = Math.max(0, f(eGasC)-f(eGasP));
                        sumGas = d * (float)o.optDouble("gas_t");
                        tGas.setText(String.format("Расход: %.2f | Итого: %.2f ₽", d, sumGas));
                    } else {
                        sumGas = (float)o.optDouble("gas_t");
                        tGas.setText(String.format("Фикс: %.2f ₽", sumGas));
                    }
                    total += sumGas;
                }
                
                tTot.setText(Math.round(total) + " ₽");

                try {
                    JSONObject c = new JSONObject();
                    if(eElP!=null) { c.put("elP", eElP.getText()); c.put("elC", eElC.getText()); }
                    if(eCWP!=null) {
                        c.put("cwP", eCWP.getText()); JSONArray a=new JSONArray(); for(EditText e:cwIns) a.put(e.getText()); c.put("cwA", a);
                    }
                    if(eHWP!=null) {
                        c.put("hwP", eHWP.getText()); JSONArray a=new JSONArray(); for(EditText e:hwIns) a.put(e.getText()); c.put("hwA", a);
                    }
                    if(eGasP!=null) { c.put("gasP", eGasP.getText()); c.put("gasC", eGasC.getText()); }
                    o.put("cur", c); saveDB();
                } catch(Exception e){}
            }

            private void saveMonth() {
                try {
                    JSONObject o = getObj();
                    JSONObject h = new JSONObject();
                    h.put("date", new SimpleDateFormat("MM.yyyy").format(new Date()));
                    h.put("tot", total); h.put("el", sumEl); h.put("cw", sumCW); h.put("hw", sumHW); h.put("sw", sumSW); h.put("gas", sumGas);
                    o.getJSONArray("hist").put(h);

                    if(eElP!=null) { eElP.setText(eElC.getText()); eElC.setText(""); }
                    if(eCWP!=null) { float s=0; for(EditText e:cwIns){s+=f(e); e.setText("");} eCWP.setText(String.valueOf(s)); }
                    if(eHWP!=null) { float s=0; for(EditText e:hwIns){s+=f(e); e.setText("");} eHWP.setText(String.valueOf(s)); }
                    if(eGasP!=null) { eGasP.setText(eGasC.getText()); eGasC.setText(""); }
                    
                    saveDB(); Toast.makeText(this,"Сохранено в историю", Toast.LENGTH_SHORT).show(); doCalc();
                } catch(Exception e){}
            }

            // ===== ЭКРАН 3: НАСТРОЙКИ =====
            private void showSet() {
                JSONObject o = getObj(); if(o==null) return;
                mainContainer.removeAllViews();
                ScrollView sv = new ScrollView(this);
                LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(dp(16), dp(16), dp(16), dp(16));
                setupObjNav(); l.addView(objNav);

                LinearLayout c = makeCard(); c.addView(title("Тумблеры и тарифы"));
                
                // Эл-во
                Switch sE = makeSw("⚡ Электричество", o.optBoolean("en_el")); c.addView(sE);
                LinearLayout vE = new LinearLayout(this); vE.setOrientation(LinearLayout.VERTICAL);
                EditText ek = inp("Коэфф", 0, String.valueOf(o.optDouble("el_k"))); vE.addView(ek);
                EditText et = inp("Тариф", 0, String.valueOf(o.optDouble("el_t"))); vE.addView(et);
                EditText ev = inp("НДС %", 0, String.valueOf(o.optDouble("el_v"))); vE.addView(ev);
                c.addView(vE); bindSw(sE, vE);

                // ХВС
                c.addView(div()); Switch sC = makeSw("💧 Холодная вода", o.optBoolean("en_cw")); c.addView(sC);
                LinearLayout vC = new LinearLayout(this); vC.setOrientation(LinearLayout.VERTICAL);
                EditText cc = inp("Кол-во счетчиков", 0, String.valueOf(o.optInt("cw_c"))); vC.addView(cc);
                EditText ct = inp("Тариф", 0, String.valueOf(o.optDouble("cw_t"))); vC.addView(ct);
                c.addView(vC); bindSw(sC, vC);

                // ГВС
                c.addView(div()); Switch sH = makeSw("🔥 Горячая вода", o.optBoolean("en_hw")); c.addView(sH);
                LinearLayout vH = new LinearLayout(this); vH.setOrientation(LinearLayout.VERTICAL);
                EditText hc = inp("Кол-во счетчиков", 0, String.valueOf(o.optInt("hw_c"))); vH.addView(hc);
                EditText ht = inp("Тариф", 0, String.valueOf(o.optDouble("hw_t"))); vH.addView(ht);
                c.addView(vH); bindSw(sH, vH);

                // Водоотвод
                c.addView(div()); Switch sS = makeSw("🚰 Водоотведение", o.optBoolean("en_sw")); c.addView(sS);
                LinearLayout vS = new LinearLayout(this); vS.setOrientation(LinearLayout.VERTICAL);
                EditText st = inp("Тариф за 1 куб (ХВС+ГВС)", 0, String.valueOf(o.optDouble("sw_t"))); vS.addView(st);
                c.addView(vS); bindSw(sS, vS);

                // Газ
                c.addView(div()); Switch sG = makeSw("💨 Газ", o.optBoolean("en_gas")); c.addView(sG);
                LinearLayout vG = new LinearLayout(this); vG.setOrientation(LinearLayout.VERTICAL);
                Switch sGm = makeSw("Считать по счетчику (иначе фикс)", o.optBoolean("gas_m")); vG.addView(sGm);
                EditText gt = inp("Тариф (или фикс. сумма)", 0, String.valueOf(o.optDouble("gas_t"))); vG.addView(gt);
                c.addView(vG); bindSw(sG, vG);

                Button b = new Button(this); b.setText("Сохранить"); b.setTextColor(Color.WHITE);
                GradientDrawable bg = new GradientDrawable(); bg.setColor(Color.parseColor("#34C759")); bg.setCornerRadius(dp(12)); b.setBackground(bg);
                LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(-1,-2); bp.setMargins(0,dp(20),0,0); b.setLayoutParams(bp);
                b.setOnClickListener(v -> {
                    try {
                        o.put("en_el", sE.isChecked()); o.put("el_k", f(ek)); o.put("el_t", f(et)); o.put("el_v", f(ev));
                        o.put("en_cw", sC.isChecked()); o.put("cw_c", (int)f(cc)); o.put("cw_t", f(ct));
                        o.put("en_hw", sH.isChecked()); o.put("hw_c", (int)f(hc)); o.put("hw_t", f(ht));
                        o.put("en_sw", sS.isChecked()); o.put("sw_t", f(st));
                        o.put("en_gas", sG.isChecked()); o.put("gas_m", sGm.isChecked()); o.put("gas_t", f(gt));
                        saveDB(); Toast.makeText(this,"Сохранено!", Toast.LENGTH_SHORT).show(); showCalc();
                    } catch(Exception ex){}
                });
                c.addView(b); l.addView(c); sv.addView(l); mainContainer.addView(sv);
            }

            private Switch makeSw(String t, boolean c) {
                Switch s = new Switch(this); s.setText(t); s.setChecked(c); s.setTextColor(colorText1);
                s.setTypeface(null, Typeface.BOLD); s.setPadding(0,dp(8),0,dp(8)); return s;
            }
            private void bindSw(Switch s, View v) {
                v.setVisibility(s.isChecked() ? View.VISIBLE : View.GONE);
                s.setOnCheckedChangeListener((btn, is) -> v.setVisibility(is ? View.VISIBLE : View.GONE));
            }

            // ===== ЭКРАН 4: ИСТОРИЯ =====
            private void showHist() {
                JSONObject o = getObj(); if(o==null) return;
                mainContainer.removeAllViews();
                ScrollView sv = new ScrollView(this);
                LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(dp(16), dp(16), dp(16), dp(16));
                setupObjNav(); l.addView(objNav);

                try {
                    JSONArray arr = o.getJSONArray("hist");
                    for(int i=arr.length()-1; i>=0; i--) {
                        JSONObject h = arr.getJSONObject(i);
                        LinearLayout c = makeCard();
                        TextView td = new TextView(this); tl(td, "📅 " + h.getString("date"), colorAccent, 16); c.addView(td);
                        TextView tt = new TextView(this); tl(tt, String.format("Итого: %.2f ₽", h.getDouble("tot")), colorText1, 20); c.addView(tt);
                        TextView tx = new TextView(this); 
                        tx.setText(String.format("Эл: %.0f | ХВС: %.0f | ГВС: %.0f\nВодоотв: %.0f | Газ: %.0f", h.getDouble("el"),h.getDouble("cw"),h.getDouble("hw"),h.getDouble("sw"),h.getDouble("gas")));
                        tx.setTextColor(colorText2); c.addView(tx);
                        l.addView(c);
                    }
                } catch(Exception e){}
                sv.addView(l); mainContainer.addView(sv);
            }
            private void tl(TextView t, String text, int c, int s) { t.setText(text); t.setTextColor(c); t.setTextSize(s); t.setTypeface(null, Typeface.BOLD); }

            // ===== ХЕЛПЕРЫ UI =====
            private LinearLayout makeCard() {
                LinearLayout c = new LinearLayout(this); c.setOrientation(LinearLayout.VERTICAL); c.setPadding(dp(16),dp(16),dp(16),dp(16));
                GradientDrawable b = new GradientDrawable(); b.setColor(colorCard); b.setCornerRadius(dp(16)); c.setBackground(b);
                LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2); p.setMargins(0,0,0,dp(12)); c.setLayoutParams(p);
                return c;
            }
            private TextView title(String t) { TextView tv = new TextView(this); tv.setText(t); tv.setTextColor(colorAccent); tv.setTextSize(16); tv.setTypeface(null, Typeface.BOLD); tv.setPadding(0,0,0,dp(12)); return tv; }
            private TextView info() { TextView tv = new TextView(this); tv.setTextColor(colorText1); tv.setPadding(0,dp(4),0,0); return tv; }
            private View div() { View v = new View(this); v.setBackgroundColor(colorDiv); LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,dp(1)); p.setMargins(0,dp(12),0,dp(12)); v.setLayoutParams(p); return v; }
            private EditText inp(String h, float w, String val) {
                EditText e = new EditText(this); e.setHint(h); e.setText(val); e.setTextColor(colorText1); e.setHintTextColor(colorText2);
                e.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL); e.setPadding(dp(12),dp(12),dp(12),dp(12));
                GradientDrawable bg = new GradientDrawable(); bg.setColor(colorBg); bg.setCornerRadius(dp(10)); e.setBackground(bg);
                e.addTextChangedListener(new TextWatcher() { public void afterTextChanged(Editable s){doCalc();} public void beforeTextChanged(CharSequence s,int a,int b,int c){} public void onTextChanged(CharSequence s,int a,int b,int c){} });
                if(w>0) { LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0,-2,w); p.setMargins(dp(4),dp(4),dp(4),dp(8)); e.setLayoutParams(p); }
                else { LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2); p.setMargins(0,dp(4),0,dp(8)); e.setLayoutParams(p); }
                return e;
            }
            private int dp(int v) { return (int)TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()); }
        }
        EOF

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Communal-Pro-APK
        path: app/build/outputs/apk/debug/*.apk
