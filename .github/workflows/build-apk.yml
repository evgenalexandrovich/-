name: Build Native Kotlin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/calc/app
        mkdir -p app/src/main/res/values

        # 1. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "CommCalc"
        include(":app")
        EOF

        # 2. Root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.1.1" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }
        EOF

        # 3. app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
        android {
            namespace = "com.calc.app"
            compileSdk = 34
            defaultConfig { applicationId = "com.calc.app"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.1" }
        }
        dependencies {
            implementation(platform("androidx.compose:compose-bom:2023.08.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.activity:activity-compose:1.7.2")
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Коммуналка" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.kt (Весь код Kotlin приложения)
        cat << 'EOF' > app/src/main/java/com/calc/app/MainActivity.kt
        package com.calc.app

        import android.content.Context
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.text.KeyboardOptions
        import androidx.compose.foundation.verticalScroll
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.Home
        import androidx.compose.material.icons.filled.Settings
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.text.input.KeyboardType
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import kotlin.math.roundToInt

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val prefs = getSharedPreferences("AppPrefs", Context.MODE_PRIVATE)
                
                setContent {
                    MaterialTheme(colorScheme = lightColorScheme(primary = androidx.compose.ui.graphics.Color(0xFF006494))) {
                        var currentScreen by remember { mutableIntStateOf(0) }
                        
                        Scaffold(
                            bottomBar = {
                                NavigationBar {
                                    NavigationBarItem(icon = { Icon(Icons.Default.Home, "") }, label = { Text("Расчет") }, selected = currentScreen == 0, onClick = { currentScreen = 0 })
                                    NavigationBarItem(icon = { Icon(Icons.Default.Settings, "") }, label = { Text("Настройки") }, selected = currentScreen == 1, onClick = { currentScreen = 1 })
                                }
                            }
                        ) { padding ->
                            Box(modifier = Modifier.padding(padding).fillMaxSize()) {
                                if (currentScreen == 0) CalcScreen(prefs) else SettingsScreen(prefs, onSaved = { currentScreen = 0 })
                            }
                        }
                    }
                }
            }
        }

        @Composable
        fun CalcScreen(prefs: android.content.SharedPreferences) {
            val elCoeff = prefs.getFloat("elCoeff", 40f)
            val elTariff = prefs.getFloat("elTariff", 10.48f)
            val elVat = prefs.getFloat("elVat", 20f)
            val wTariff = prefs.getFloat("wTariff", 71.55f)
            val gasFixed = prefs.getFloat("gasFixed", 10000f)

            var elPrev by remember { mutableStateOf(prefs.getString("elP", "") ?: "") }
            var elCurr by remember { mutableStateOf(prefs.getString("elC", "") ?: "") }
            var w1 by remember { mutableStateOf(prefs.getString("w1", "") ?: "") }
            var w2 by remember { mutableStateOf(prefs.getString("w2", "") ?: "") }
            var w3 by remember { mutableStateOf(prefs.getString("w3", "") ?: "") }
            var w4 by remember { mutableStateOf(prefs.getString("w4", "") ?: "") }
            var wPrevSum by remember { mutableStateOf(prefs.getString("wP", "") ?: "") }

            val elDiff = ((elCurr.toFloatOrNull() ?: 0f) - (elPrev.toFloatOrNull() ?: 0f)).coerceAtLeast(0f)
            val elKvt = elDiff * elCoeff
            val elSum = elKvt * elTariff * (1 + elVat / 100f)

            val wCurSum = (w1.toFloatOrNull()?:0f) + (w2.toFloatOrNull()?:0f) + (w3.toFloatOrNull()?:0f) + (w4.toFloatOrNull()?:0f)
            val wDiff = (wCurSum - (wPrevSum.toFloatOrNull() ?: 0f)).coerceAtLeast(0f)
            val wSum = wDiff * wTariff

            val total = elSum + wSum + gasFixed

            LaunchedEffect(elPrev, elCurr, w1, w2, w3, w4, wPrevSum) {
                prefs.edit().putString("elP", elPrev).putString("elC", elCurr)
                    .putString("w1", w1).putString("w2", w2).putString("w3", w3).putString("w4", w4)
                    .putString("wP", wPrevSum).apply()
            }

            Column(modifier = Modifier.verticalScroll(rememberScrollState()).padding(16.dp)) {
                
                Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primary), modifier = Modifier.fillMaxWidth().padding(bottom = 16.dp)) {
                    Column(modifier = Modifier.padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                        Text("ИТОГО К ОПЛАТЕ", color = androidx.compose.ui.graphics.Color.White, fontSize = 14.sp)
                        Text("${total.roundToInt()} ₽", color = androidx.compose.ui.graphics.Color.White, fontSize = 36.sp, fontWeight = FontWeight.Bold)
                        Spacer(Modifier.height(16.dp))
                        Button(onClick = { 
                            elPrev = elCurr; elCurr = ""; wPrevSum = wCurSum.toString()
                            w1 = ""; w2 = ""; w3 = ""; w4 = ""
                        }, colors = ButtonDefaults.buttonColors(containerColor = androidx.compose.ui.graphics.Color.White, contentColor = MaterialTheme.colorScheme.primary)) {
                            Text("Закрыть месяц")
                        }
                    }
                }

                Card(modifier = Modifier.fillMaxWidth().padding(bottom = 16.dp)) {
                    Column(modifier = Modifier.padding(16.dp)) {
                        Text("⚡ Электроэнергия", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                        Spacer(Modifier.height(8.dp))
                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                            OutlinedTextField(value = elPrev, onValueChange = { elPrev = it }, label = { Text("Пред.") }, modifier = Modifier.weight(1f), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                            OutlinedTextField(value = elCurr, onValueChange = { elCurr = it }, label = { Text("Тек.") }, modifier = Modifier.weight(1f), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                        }
                        Text("Расход: ${elKvt.roundToInt()} кВт  →  Итого: %.2f ₽".format(elSum), modifier = Modifier.padding(top = 8.dp), fontWeight = FontWeight.Medium)
                    }
                }

                Card(modifier = Modifier.fillMaxWidth().padding(bottom = 16.dp)) {
                    Column(modifier = Modifier.padding(16.dp)) {
                        Text("💧 Вода и канализация", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                        Spacer(Modifier.height(8.dp))
                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                            OutlinedTextField(value = w1, onValueChange = { w1 = it }, label = { Text("№1") }, modifier = Modifier.weight(1f), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                            OutlinedTextField(value = w2, onValueChange = { w2 = it }, label = { Text("№2") }, modifier = Modifier.weight(1f), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                        }
                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.padding(top=8.dp)) {
                            OutlinedTextField(value = w3, onValueChange = { w3 = it }, label = { Text("№3") }, modifier = Modifier.weight(1f), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                            OutlinedTextField(value = w4, onValueChange = { w4 = it }, label = { Text("№4") }, modifier = Modifier.weight(1f), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                        }
                        OutlinedTextField(value = wPrevSum, onValueChange = { wPrevSum = it }, label = { Text("Сумма прошлый месяц") }, modifier = Modifier.fillMaxWidth().padding(top=8.dp), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                        Text("Расход: ${wDiff} м³  →  Итого: %.2f ₽".format(wSum), modifier = Modifier.padding(top = 8.dp), fontWeight = FontWeight.Medium)
                    }
                }

                Card(modifier = Modifier.fillMaxWidth()) {
                    Column(modifier = Modifier.padding(16.dp)) {
                        Text("🔥 Газ (Фиксированно)", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                        Text("Итого: %.2f ₽".format(gasFixed), modifier = Modifier.padding(top = 8.dp), fontWeight = FontWeight.Medium)
                    }
                }
                Spacer(Modifier.height(30.dp))
            }
        }

        @Composable
        fun SettingsScreen(prefs: android.content.SharedPreferences, onSaved: () -> Unit) {
            var elCoeff by remember { mutableStateOf(prefs.getFloat("elCoeff", 40f).toString()) }
            var elTariff by remember { mutableStateOf(prefs.getFloat("elTariff", 10.48f).toString()) }
            var elVat by remember { mutableStateOf(prefs.getFloat("elVat", 20f).toString()) }
            var wTariff by remember { mutableStateOf(prefs.getFloat("wTariff", 71.55f).toString()) }
            var gasFixed by remember { mutableStateOf(prefs.getFloat("gasFixed", 10000f).toString()) }

            Column(modifier = Modifier.padding(16.dp).verticalScroll(rememberScrollState())) {
                Text("⚙️ Настройки тарифов", fontSize = 24.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(bottom = 16.dp))
                
                OutlinedTextField(value = elCoeff, onValueChange = { elCoeff = it }, label = { Text("Коэфф. трансформации") }, modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                OutlinedTextField(value = elTariff, onValueChange = { elTariff = it }, label = { Text("Тариф Эл-во (₽)") }, modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                OutlinedTextField(value = elVat, onValueChange = { elVat = it }, label = { Text("НДС (%)") }, modifier = Modifier.fillMaxWidth().padding(bottom = 16.dp), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                
                Divider()
                OutlinedTextField(value = wTariff, onValueChange = { wTariff = it }, label = { Text("Тариф Вода (₽)") }, modifier = Modifier.fillMaxWidth().padding(vertical = 16.dp), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                
                Divider()
                OutlinedTextField(value = gasFixed, onValueChange = { gasFixed = it }, label = { Text("Фикс. ГАЗ (₽)") }, modifier = Modifier.fillMaxWidth().padding(vertical = 16.dp), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))

                Button(onClick = {
                    prefs.edit()
                        .putFloat("elCoeff", elCoeff.toFloatOrNull() ?: 40f)
                        .putFloat("elTariff", elTariff.toFloatOrNull() ?: 10.48f)
                        .putFloat("elVat", elVat.toFloatOrNull() ?: 20f)
                        .putFloat("wTariff", wTariff.toFloatOrNull() ?: 71.55f)
                        .putFloat("gasFixed", gasFixed.toFloatOrNull() ?: 10000f)
                        .apply()
                    onSaved()
                }, modifier = Modifier.fillMaxWidth().height(56.dp)) {
                    Text("Сохранить и вернуться", fontSize = 16.sp)
                }
            }
        }
        EOF

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Native-CommCalc-APK
        path: app/build/outputs/apk/debug/app-debug.apk
