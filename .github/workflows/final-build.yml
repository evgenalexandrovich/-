name: Final Native Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Project Files
      run: |
        mkdir -p app/src/main/java/com/calc/app
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout

        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "CommCalc"
        include ':app'
        EOF

        # 2. build.gradle (Root)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.calc.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.calc.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Коммуналка" android:theme="@style/Theme.MaterialComponents.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.java (Весь код логики и дизайна)
        cat << 'EOF' > app/src/main/java/com/calc/app/MainActivity.java
        package com.calc.app;

        import android.content.Context;
        import android.content.SharedPreferences;
        import android.graphics.Color;
        import android.graphics.Typeface;
        import android.graphics.drawable.GradientDrawable;
        import android.os.Bundle;
        import android.text.Editable;
        import android.text.InputType;
        import android.text.TextWatcher;
        import android.util.TypedValue;
        import android.view.Gravity;
        import android.view.View;
        import android.view.ViewGroup;
        import android.widget.*;
        import androidx.appcompat.app.AlertDialog;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private SharedPreferences prefs;
            private View calcView, settingsView;
            private Button btnTabCalc, btnTabSettings;
            private EditText editElP, editElC, editW1, editW2, editW3, editW4, editWP;
            private TextView txtTotal, txtElRes, txtWRes, txtGasRes;
            private EditText setElK, setElT, setElV, setWT, setG;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                prefs = getSharedPreferences("Prefs", MODE_PRIVATE);

                LinearLayout root = new LinearLayout(this);
                root.setOrientation(LinearLayout.VERTICAL);
                root.setBackgroundColor(Color.parseColor("#F2F2F7"));

                FrameLayout container = new FrameLayout(this);
                container.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));

                calcView = createCalcScreen();
                settingsView = createSettingsScreen();
                container.addView(calcView);
                container.addView(settingsView);
                settingsView.setVisibility(View.GONE);

                LinearLayout nav = new LinearLayout(this);
                nav.setBackgroundColor(Color.WHITE);
                nav.setElevation(20);
                btnTabCalc = createTab("📊 Расчет", true);
                btnTabSettings = createTab("⚙️ Опции", false);
                nav.addView(btnTabCalc);
                nav.addView(btnTabSettings);

                root.addView(container);
                root.addView(nav);
                setContentView(root);
                calculate();
            }

            private Button createTab(String text, boolean active) {
                Button b = new Button(this);
                b.setText(text);
                b.setBackgroundColor(Color.TRANSPARENT);
                b.setTextColor(active ? Color.parseColor("#007AFF") : Color.GRAY);
                b.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));
                b.setOnClickListener(v -> {
                    calcView.setVisibility(text.contains("Расчет") ? View.VISIBLE : View.GONE);
                    settingsView.setVisibility(text.contains("Расчет") ? View.GONE : View.VISIBLE);
                    btnTabCalc.setTextColor(text.contains("Расчет") ? Color.parseColor("#007AFF") : Color.GRAY);
                    btnTabSettings.setTextColor(text.contains("Расчет") ? Color.GRAY : Color.parseColor("#007AFF"));
                });
                return b;
            }

            private View createCalcScreen() {
                ScrollView sv = new ScrollView(this);
                LinearLayout l = new LinearLayout(this);
                l.setOrientation(LinearLayout.VERTICAL);
                l.setPadding(40, 40, 40, 40);

                // Карточка ИТОГО
                LinearLayout resCard = new LinearLayout(this);
                resCard.setOrientation(LinearLayout.VERTICAL);
                resCard.setGravity(Gravity.CENTER);
                resCard.setPadding(40, 60, 40, 60);
                GradientDrawable gd = new GradientDrawable();
                gd.setColor(Color.parseColor("#007AFF"));
                gd.setCornerRadius(40);
                resCard.setBackground(gd);

                txtTotal = new TextView(this);
                txtTotal.setTextSize(32);
                txtTotal.setTextColor(Color.WHITE);
                txtTotal.setTypeface(null, Typeface.BOLD);
                
                Button btnClose = new Button(this);
                btnClose.setText("Закрыть месяц");
                btnClose.setOnClickListener(v -> {
                    editElP.setText(editElC.getText().toString());
                    editElC.setText("");
                    float wSum = getF(editW1)+getF(editW2)+getF(editW3)+getF(editW4);
                    editWP.setText(String.valueOf(wSum));
                    editW1.setText(""); editW2.setText(""); editW3.setText(""); editW4.setText("");
                    calculate();
                });

                resCard.addView(txtTotal);
                resCard.addView(btnClose);
                l.addView(resCard);

                // Секции
                editElP = addInp(l, "Эл-во: Пред."); editElC = addInp(l, "Эл-во: Тек.");
                txtElRes = addTxt(l);
                
                editW1 = addInp(l, "Вода 1"); editW2 = addInp(l, "Вода 2");
                editW3 = addInp(l, "Вода 3"); editW4 = addInp(l, "Вода 4");
                editWP = addInp(l, "Вода: Пред. Сумма");
                txtWRes = addTxt(l);

                txtGasRes = addTxt(l);

                sv.addView(l);
                return sv;
            }

            private View createSettingsScreen() {
                LinearLayout l = new LinearLayout(this);
                l.setOrientation(LinearLayout.VERTICAL);
                l.setPadding(40, 40, 40, 40);
                setElK = addInp(l, "Коэффициент (40)"); setElK.setText("40");
                setElT = addInp(l, "Тариф эл-во (10.48)"); setElT.setText("10.48");
                setElV = addInp(l, "НДС эл-во % (20)"); setElV.setText("20");
                setWT = addInp(l, "Тариф вода (71.55)"); setWT.setText("71.55");
                setG = addInp(l, "Газ фикс. (10000)"); setG.setText("10000");
                return l;
            }

            private EditText addInp(LinearLayout l, String hint) {
                EditText e = new EditText(this);
                e.setHint(hint);
                e.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                e.addTextChangedListener(new TextWatcher() {
                    public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                    public void onTextChanged(CharSequence s, int start, int before, int count) { calculate(); }
                    public void afterTextChanged(Editable s) {}
                });
                l.addView(e);
                return e;
            }

            private TextView addTxt(LinearLayout l) {
                TextView t = new TextView(this);
                t.setPadding(0, 10, 0, 30);
                l.addView(t);
                return t;
            }

            private float getF(EditText e) { try { return Float.parseFloat(e.getText().toString()); } catch(Exception ex) { return 0; } }

            private void calculate() {
                float eK = getF(setElK), eT = getF(setElT), eV = getF(setElV), wT = getF(setWT), gF = getF(setG);
                float eD = Math.max(0, getF(editElC) - getF(editElP));
                float eSum = eD * eK * eT * (1 + eV/100);
                txtElRes.setText("Эл-во: " + String.format("%.2f", eSum) + " р.");

                float wD = Math.max(0, (getF(editW1)+getF(editW2)+getF(editW3)+getF(editW4)) - getF(editWP));
                float wSum = wD * wT;
                txtWRes.setText("Вода: " + String.format("%.2f", wSum) + " р.");
                
                txtGasRes.setText("Газ: " + gF + " р.");
                txtTotal.setText(Math.round(eSum + wSum + gF) + " ₽");
            }
        }
        EOF

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: app/build/outputs/apk/debug/*.apk
