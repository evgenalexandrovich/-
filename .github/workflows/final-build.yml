name: Mobile App Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Project Structure
      run: |
        mkdir -p app/src/main/java/com/utility/calc
        mkdir -p app/src/main/res/values
        
        # 1. Настройки проекта
        echo "rootProject.name = 'CommCalc'" > settings.gradle
        echo "include ':app'" >> settings.gradle

        # 2. Корневой билд-файл
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. Билд-файл приложения
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.utility.calc'
            compileSdk 34
            defaultConfig {
                applicationId "com.utility.calc"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # 4. Манифест
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Коммуналка" android:theme="@style/Theme.MaterialComponents.Light.NoActionBar">
                <activity android:name="com.utility.calc.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. Главный код приложения (Дизайн + Логика)
        cat << 'EOF' > app/src/main/java/com/utility/calc/MainActivity.java
        package com.utility.calc;

        import android.content.SharedPreferences;
        import android.graphics.Color;
        import android.graphics.Typeface;
        import android.graphics.drawable.GradientDrawable;
        import android.os.Bundle;
        import android.text.Editable;
        import android.text.InputType;
        import android.text.TextWatcher;
        import android.view.Gravity;
        import android.view.View;
        import android.view.ViewGroup;
        import android.widget.*;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            SharedPreferences p;
            EditText eElP, eElC, eW1, eW2, eW3, eW4, eWP;
            EditText sK, sT, sV, sWT, sG;
            TextView tTot, tEl, tW, tG;
            View calcScreen, setScreen;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                p = getSharedPreferences("C", MODE_PRIVATE);

                LinearLayout root = new LinearLayout(this);
                root.setOrientation(LinearLayout.VERTICAL);
                root.setBackgroundColor(Color.parseColor("#F2F2F7"));

                FrameLayout host = new FrameLayout(this);
                host.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));

                calcScreen = createCalc();
                setScreen = createSet();
                host.addView(calcScreen);
                host.addView(setScreen);
                setScreen.visibility = View.GONE;

                LinearLayout nav = new LinearLayout(this);
                nav.setBackgroundColor(Color.WHITE);
                nav.setElevation(30);
                nav.addView(createTab("📊 Расчет", true));
                nav.addView(createTab("⚙️ Настройки", false));

                root.addView(host);
                root.addView(nav);
                setContentView(root);
                load();
            }

            View createTab(String txt, boolean active) {
                Button b = new Button(this);
                b.setText(txt);
                b.setBackgroundColor(0);
                b.setTextColor(active ? Color.parseColor("#007AFF") : Color.GRAY);
                b.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));
                b.setOnClickListener(v -> {
                    boolean isCalc = txt.contains("Расчет");
                    calcScreen.visibility = isCalc ? View.VISIBLE : View.GONE;
                    setScreen.visibility = isCalc ? View.GONE : View.VISIBLE;
                    ((Button)v).setTextColor(Color.parseColor("#007AFF"));
                    if(isCalc) b.setTextColor(Color.parseColor("#007AFF"));
                });
                return b;
            }

            View createCalc() {
                ScrollView sv = new ScrollView(this);
                LinearLayout l = new LinearLayout(this);
                l.setOrientation(LinearLayout.VERTICAL);
                l.setPadding(40, 40, 40, 40);

                LinearLayout header = new LinearLayout(this);
                header.setOrientation(LinearLayout.VERTICAL);
                header.setPadding(60, 80, 60, 80);
                header.setGravity(Gravity.CENTER);
                GradientDrawable gd = new GradientDrawable();
                gd.setColor(Color.parseColor("#007AFF"));
                gd.setCornerRadius(50);
                header.setBackground(gd);

                tTot = new TextView(this);
                tTot.setTextSize(40);
                tTot.setTextColor(-1);
                tTot.setTypeface(null, Typeface.BOLD);
                
                Button btnSave = new Button(this);
                btnSave.setText("Закрыть месяц");
                btnSave.setOnClickListener(v -> {
                    eElP.setText(eElC.getText()); eElC.setText("");
                    float wS = getF(eW1)+getF(eW2)+getF(eW3)+getF(eW4);
                    eWP.setText(String.valueOf(wS));
                    eW1.setText(""); eW2.setText(""); eW3.setText(""); eW4.setText("");
                    calc();
                });

                header.addView(tTot); header.addView(btnSave);
                l.addView(header);

                eElP = ins(l, "Эл-во: Пред."); eElC = ins(l, "Эл-во: Тек.");
                tEl = txt(l);
                eW1 = ins(l, "Вода 1"); eW2 = ins(l, "Вода 2");
                eW3 = ins(l, "Вода 3"); eW4 = ins(l, "Вода 4");
                eWP = ins(l, "Вода: Пред. сумма");
                tW = txt(l);
                tG = txt(l);

                sv.addView(l);
                return sv;
            }

            View createSet() {
                LinearLayout l = new LinearLayout(this);
                l.setOrientation(LinearLayout.VERTICAL);
                l.setPadding(40, 40, 40, 40);
                sK = ins(l, "Коэффициент (40)"); sT = ins(l, "Тариф эл-во");
                sV = ins(l, "НДС %"); sWT = ins(l, "Тариф вода");
                sG = ins(l, "Газ фикс.");
                return l;
            }

            EditText ins(LinearLayout l, String h) {
                EditText e = new EditText(this);
                e.setHint(h);
                e.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                e.addTextChangedListener(new TextWatcher() {
                    public void afterTextChanged(Editable s) { calc(); }
                    public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                    public void onTextChanged(CharSequence s, int start, int before, int count) {}
                });
                l.addView(e);
                return e;
            }

            TextView txt(LinearLayout l) {
                TextView t = new TextView(this);
                t.setPadding(10, 10, 10, 40);
                t.setTypeface(null, Typeface.BOLD);
                l.addView(t);
                return t;
            }

            float getF(EditText e) { try{return Float.parseFloat(e.getText().toString());}catch(Exception ex){return 0;} }

            void calc() {
                float ek = getF(sK), et = getF(sT), ev = getF(sV), wt = getF(sWT), gf = getF(sG);
                float ed = Math.max(0, getF(eElC)-getF(eElP)) * ek;
                float es = ed * et * (1 + ev/100);
                tEl.setText("Электричество: " + String.format("%.2f", es) + " р.");
                
                float wd = Math.max(0, (getF(eW1)+getF(eW2)+getF(eW3)+getF(eW4)) - getF(eWP));
                float ws = wd * wt;
                tW.setText("Вода: " + String.format("%.2f", ws) + " р.");
                tG.setText("Газ: " + gf + " р.");
                tTot.setText(Math.round(es + ws + gf) + " ₽");
            }

            void load() {
                sK.setText("40"); sT.setText("10.48"); sV.setText("20"); sWT.setText("71.55"); sG.setText("10000");
                calc();
            }
        }
        EOF

    - name: Build with Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: CommCalc-App
        path: app/build/outputs/apk/debug/*.apk
